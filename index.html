<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portfolio Under Construction — Dilshad Alam</title>
  <meta name="description" content="Portfolio of Dilshad Alam is under construction. Reach out at mail@dilshadalam.com.np.">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg: #080d1a;
      --text: #e8edf7;
      --accent: #4f8cff;
      --accent-2: #22d3ee;
      --accent-3: #ffd166;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 24px 20px;
      overflow: hidden;
      overscroll-behavior: none;
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background:
        radial-gradient(900px 520px at 50% -12%, rgba(79, 140, 255, 0.24), transparent 60%),
        radial-gradient(700px 420px at 50% 110%, rgba(34, 211, 238, 0.14), transparent 60%),
        var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 34rem;
    }

    /* keep children inside the viewport so the centered flex never overflows */
    main > * {
      max-width: 100%;
      min-width: 0;
    }

    .portrait {
      width: min(100%, 360px, calc(50vh * 1.7962));
      aspect-ratio: 670 / 373;
      padding: 5px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      box-shadow: 0 22px 55px rgba(79, 140, 255, 0.28);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      border: 4px solid var(--bg);
      border-radius: 14px;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 5.2vw, 2rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    /* ---------- corner identity badge ---------- */
    .corner-id {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 2;
      width: max-content;
      max-width: calc(100vw - 40px);
      text-align: left;
      pointer-events: none;
    }

    .corner-id p {
      margin: 0;
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: break-word;
    }

    .corner-id .corner-id__name {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #05070d;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      font-size: 20px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .corner-id .corner-id__name .corner-id__dot {
      margin-left: 2px;
      font-size: 28px;
      font-weight: 900;
      line-height: 0;
      color: #ffffff;
    }

    .corner-id .corner-id__role {
      font-size: 18px;
      color: rgba(232, 237, 247, 0.72);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .corner-id .corner-id__divider {
      display: block;
      width: 100%;
      height: 2px;
      margin: 8px 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
      opacity: 0.75;
    }

    .corner-id .corner-id__rule {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
    }

    .corner-id .corner-id__rule span {
      display: block;
      height: 7px;
      border-radius: 999px;
    }

    .corner-id .corner-id__rule span:nth-child(1) {
      width: 52px;
      background: #e56e1c;
    }

    .corner-id .corner-id__rule span:nth-child(2) {
      width: 124px;
      background: linear-gradient(90deg, #f5a623, #f7b733);
    }

    .corner-id .corner-id__rule span:nth-child(3) {
      width: 58px;
      background: #d89145;
    }

    /* ---------- email pill ---------- */
    .email-pill {
      display: inline-block;
      max-width: 100%;
      margin: 0;
      padding: 14px 30px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: #05070d;
      color: var(--text);
      font-size: clamp(1.05rem, 3.8vw, 1.3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
      text-decoration: none;
      overflow-wrap: break-word;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .email-pill:hover,
    .email-pill:focus-visible {
      color: var(--accent-2);
      border-color: rgba(34, 211, 238, 0.6);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-height: 740px) {
      body {
        justify-content: flex-start;
        padding-top: 172px;
      }

      main {
        gap: 10px;
        margin-top: 0;
      }

      .portrait {
        width: min(100%, 300px, calc((100vh - 380px) * 1.7962));
      }

      h1 {
        font-size: 1.25rem;
      }

      .email-pill {
        padding: 10px 22px;
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .email-pill {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="corner-id">
    <p class="corner-id__name">Dilshad Alam<span class="corner-id__dot">.</span></p>
    <span class="corner-id__divider" aria-hidden="true"></span>
    <p class="corner-id__role">Computer Engineering | Tech Enthusiast</p>
    <div class="corner-id__rule" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>

  <main>
    <div class="portrait">
      <img src="images/image.png" alt="Illustration of Dilshad Alam" width="670" height="373" draggable="false">
    </div>

    <h1>Portfolio Under Construction <span aria-hidden="true">🚧</span></h1>

    <a class="email-pill" href="mailto:mail@dilshadalam.com.np">mail@<wbr>dilshadalam.<wbr>com.np</a>
  </main>

  <script>
    (function () {
      "use strict";

      var stop = function (event) {
        event.preventDefault();
      };

      ["copy", "cut", "paste", "dragstart", "selectstart", "contextmenu", "dblclick"].forEach(function (name) {
        document.addEventListener(name, stop, false);
      });

      document.addEventListener("keydown", function (event) {
        var key = event.key;

        if ((event.ctrlKey || event.metaKey) && (key === "+" || key === "-" || key === "=" || key === "0")) {
          event.preventDefault();
        }
      });

      window.addEventListener("wheel", function (event) {
        if (event.ctrlKey) {
          event.preventDefault();
        }
      }, { passive: false });

      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        document.addEventListener(name, stop, false);
      });

      var blockPinch = function (event) {
        if (event.touches && event.touches.length > 1) {
          event.preventDefault();
        }
      };

      document.addEventListener("touchstart", blockPinch, { passive: false });
      document.addEventListener("touchmove", blockPinch, { passive: false });
    })();
  </script>
</body>
</html>
