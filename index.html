<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Under Construction — Dilshad Alam</title>
  <meta name="description" content="Portfolio of Dilshad Alam is under construction. Reach out at mail@dilshadalam.com.np.">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg: #080d1a;
      --text: #e8edf7;
      --accent: #4f8cff;
      --accent-2: #22d3ee;
      --accent-3: #ffd166;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 50% -12%, rgba(79, 140, 255, 0.24), transparent 60%),
        radial-gradient(700px 420px at 50% 110%, rgba(34, 211, 238, 0.14), transparent 60%),
        var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 34rem;
    }

    /* keep children inside the viewport so the centered flex never overflows */
    main > * {
      max-width: 100%;
      min-width: 0;
    }

    .portrait {
      width: min(100%, 360px);
      aspect-ratio: 670 / 373;
      padding: 5px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      box-shadow: 0 22px 55px rgba(79, 140, 255, 0.28);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      border: 4px solid var(--bg);
      border-radius: 14px;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 5.2vw, 2rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    /* ---------- pills ---------- */
    .tagline-pill {
      max-width: 100%;
      margin: 0;
      padding: 8px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: #05070d;
      color: var(--text);
      font-size: clamp(0.92rem, 3.2vw, 1.02rem);
      font-weight: 700;
      overflow-wrap: break-word;
    }

    .contact-pill {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 8px;
      max-width: 100%;
      margin: 4px 0 0;
      padding: 11px 22px;
      border: 1px solid rgba(34, 211, 238, 0.45);
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.1);
      color: var(--text);
      font-size: clamp(0.92rem, 3.2vw, 1.05rem);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .contact-pill .text,
    .contact-pill .email {
      min-width: 0;
      overflow-wrap: break-word;
    }

    .contact-pill .icon {
      flex: 0 0 auto;
      width: 1.15em;
      height: 1.15em;
      color: var(--accent-2);
    }

    .contact-pill:hover,
    .contact-pill:focus-visible {
      color: var(--accent-2);
      border-color: rgba(34, 211, 238, 0.75);
      background: rgba(34, 211, 238, 0.18);
      transform: translateY(-2px);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .contact-pill {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="portrait">
      <img src="images/image.png" alt="Illustration of Dilshad Alam" width="670" height="373">
    </div>

    <h1>Portfolio Under Construction <span aria-hidden="true">🚧</span></h1>

    <p class="tagline-pill">Great things take time.</p>

    <a class="contact-pill" href="mailto:mail@dilshadalam.com.np">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"></rect>
        <path d="M3 7.5l9 6 9-6"></path>
      </svg>
      <span class="text">Get in touch:</span>
      <span class="email">mail@<wbr>dilshadalam.<wbr>com.np</span>
    </a>
  </main>
</body>
</html>
