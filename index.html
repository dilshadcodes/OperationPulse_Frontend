<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>StudiTube - Learning Platform</title>
<meta name="description" content="Self-paced online learning platform designed to help students with learning stuffs.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eceef1;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #5b6470;
  --line: #d3d8df;
  --accent: #d4351c;
  --hover: #f5f6f8;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #181b21; --ink: #eceef1; --muted: #98a1ae;
    --line: #2a2f38; --accent: #ff6a4d; --hover: #1f232a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #181b21; --ink: #eceef1; --muted: #98a1ae;
  --line: #2a2f38; --accent: #ff6a4d; --hover: #1f232a;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 10px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 40px);
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.lede { color: var(--muted); margin: 0; max-width: 62ch; font-size: 18px; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.theme {
  font-family: var(--font-body); font-size: 13px; font-weight: 600;
  padding: 7px 12px; min-height: 36px;
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); cursor: pointer;
}
.theme:hover { background: var(--hover); }
.theme svg { width: 18px; height: 18px; display: block; }
.theme-icon { display: none; }
[data-theme="dark"] .theme-icon.sun { display: block; }
[data-theme="light"] .theme-icon.moon { display: block; }

/* Right-aligned group: theme toggle + OMR download button */
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

/* OMR download button beside the theme toggle */
.omr-btn {
  font-family: var(--font-body); font-size: 13px; font-weight: 600;
  padding: 7px 12px; min-height: 36px;
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); cursor: pointer;
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.omr-btn:hover { background: var(--hover); }
.omr-btn svg { width: 18px; height: 18px; display: block; }
.omr-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status {
  margin: 0;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
}
.status.error { color: var(--accent); }

/* Module and chapter headings */
.module { display: flex; flex-direction: column; gap: 24px; }
.module > h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.chapter { display: flex; flex-direction: column; gap: 10px; }
.chapter > h3 {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

/* List: plain vertical stack */
.list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: none;
  border: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}
.theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pc{position:relative;display:flex;gap:12px;width:100%;padding:12px;list-style:none;background:var(--pc-bg);border:1px solid var(--pc-line);border-radius:10px;color:var(--pc-text);font-family:var(--font-body);
  --pc-bg:#ffffff;
  --pc-line:#d3d8df;
  --pc-text:#14171c;
  --pc-select-bg:#f5f6f8;
  --pc-select-line:#d3d8df;
  --pc-select-text:#3d4652;
  --pc-chip-bg:#e6f4fd;
  --pc-chip-line:#7cc4ee;
  --pc-chip-text:#0b6fa8;
  --pc-chevron:#6b7480;
  --pc-thumb-from:#a9c9ee;
  --pc-thumb-to:#6fa3dc;
  --pc-vignette:rgba(0,0,0,.12);
  --pc-paper-shadow:rgba(20,23,28,.28);
  --pc-meta-bg:#ffffff;
  --pc-meta-text:#14171c;
  --pc-meta-shadow:0 1px 4px rgba(20,23,28,.25);
  --pc-btn:#0284c7;
  --pc-btn-hover:#0369a1;
  --pc-btn-divider:#075985;
  --pc-btn-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .pc{
    --pc-bg:#18171c;
    --pc-line:#2c2b32;
    --pc-text:#f2f2f5;
    --pc-select-bg:#1c1b21;
    --pc-select-line:#3a3942;
    --pc-select-text:#c9c9d1;
    --pc-chip-bg:#0d2a40;
    --pc-chip-line:#2b7db3;
    --pc-chip-text:#6cc3f5;
    --pc-chevron:#aaaaaa;
    --pc-thumb-from:#1f3a5f;
    --pc-thumb-to:#2b6cb0;
    --pc-vignette:rgba(0,0,0,.4);
    --pc-paper-shadow:rgba(0,0,0,.53);
    --pc-meta-bg:#14131a;
    --pc-meta-text:#ffffff;
    --pc-meta-shadow:none;
    --pc-btn:#0ea5e9;
    --pc-btn-hover:#0b94d3;
    --pc-btn-divider:#0a4d70;
    --pc-btn-text:#ffffff;
  }
}
:root[data-theme="dark"] .pc{
  --pc-bg:#18171c;
  --pc-line:#2c2b32;
  --pc-text:#f2f2f5;
  --pc-select-bg:#1c1b21;
  --pc-select-line:#3a3942;
  --pc-select-text:#c9c9d1;
  --pc-chip-bg:#0d2a40;
  --pc-chip-line:#2b7db3;
  --pc-chip-text:#6cc3f5;
  --pc-chevron:#aaaaaa;
  --pc-thumb-from:#1f3a5f;
  --pc-thumb-to:#2b6cb0;
  --pc-vignette:rgba(0,0,0,.4);
  --pc-paper-shadow:rgba(0,0,0,.53);
  --pc-meta-bg:#14131a;
  --pc-meta-text:#ffffff;
  --pc-meta-shadow:none;
  --pc-btn:#0ea5e9;
  --pc-btn-hover:#0b94d3;
  --pc-btn-divider:#0a4d70;
  --pc-btn-text:#ffffff;
}
.pc-thumb{position:relative;flex:0 0 176px;height:100px;border-radius:7px;overflow:hidden;background:linear-gradient(135deg,var(--pc-thumb-from),var(--pc-thumb-to))}
.pc-paper{position:absolute;left:34px;top:9px;width:108px;bottom:-14px;background:#fafafa;border-radius:3px;box-shadow:0 2px 8px var(--pc-paper-shadow);padding:9px 9px 0;overflow:hidden}
.pc-paper b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:8px;line-height:1.15;color:#a31621;font-weight:800;margin-bottom:5px}
.pc-paper i{display:block;height:3px;background:#c9ccd3;border-radius:2px;margin-bottom:4px}
.pc-paper i:nth-of-type(3n){width:70%}
.pc-vignette{position:absolute;inset:0;box-shadow:inset 0 0 14px var(--pc-vignette);border-radius:7px}
.pc-meta{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:7px;background:var(--pc-meta-bg);border-radius:6px;padding:4px 7px;font-size:15px;font-weight:600;color:var(--pc-meta-text);white-space:nowrap;box-shadow:var(--pc-meta-shadow)}
.pc-pdfmark{width:20px;height:14px;background:#e11d2e;border-radius:3px;color:#fff;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pc-star{color:#f4c430;font-size:17px;line-height:1}
.pc-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.pc-title{margin:0;font-size:17px;font-weight:500;line-height:1.3;padding-right:18px;color:var(--pc-text);overflow-wrap:anywhere}
.pc-fmt{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--pc-chip-text);border:1px solid var(--pc-chip-line);background:var(--pc-chip-bg);border-radius:3px;padding:0 4px;line-height:14px;vertical-align:2px;margin-right:6px}
.pc-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
.pc-select{display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;border:1px solid var(--pc-select-line);border-radius:8px;padding:4px 6px 4px 8px;font-size:12px;font-weight:600;color:var(--pc-select-text);font-family:var(--font-mono);background:var(--pc-select-bg)}
.pc-res{border:1px solid var(--pc-chip-line);background:var(--pc-chip-bg);color:var(--pc-chip-text);border-radius:5px;padding:3px 6px;font-weight:700;white-space:nowrap}
.pc-updown{width:8px;height:14px;position:relative;margin-left:2px;flex:none}
.pc-updown::before,.pc-updown::after{content:"";position:absolute;left:0;width:5px;height:5px;border:solid var(--pc-chevron);border-width:1.5px 1.5px 0 0}
.pc-updown::before{top:3px;transform:rotate(-45deg)}
.pc-updown::after{top:8px;transform:rotate(135deg)}
.pc-dl{display:flex;align-items:stretch;flex-shrink:0;white-space:nowrap;background:var(--pc-btn);border-radius:999px;margin-left:auto;overflow:hidden;color:var(--pc-btn-text);font-weight:600}
.pc-main{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 11px;font-size:16px;color:var(--pc-btn-text);text-decoration:none;white-space:nowrap}
.pc-main:hover,.pc-more:hover{background:var(--pc-btn-hover)}
.pc-main:focus-visible{outline:2px solid var(--pc-btn-text);outline-offset:-3px}
.pc-more{display:flex;align-items:center;padding:0 10px;border-left:1.5px solid var(--pc-btn-divider)}
.pc-more .pc-updown{margin:0}
.pc-more .pc-updown::before,.pc-more .pc-updown::after{border-color:var(--pc-btn-text)}
.pc-icdoc{width:15px;height:19px;border:2px solid var(--pc-btn-text);border-radius:3px;position:relative;flex:none}
.pc-icdoc::before{content:"";position:absolute;left:2px;right:2px;top:4px;height:2px;background:var(--pc-btn-text);box-shadow:0 4px 0 var(--pc-btn-text),0 8px 0 var(--pc-btn-text)}
.pc{min-width:0;max-width:100%}
.pc-title{padding-right:0}
.pc-meta{left:50%;right:auto;transform:translateX(-50%);bottom:6px;max-width:calc(100% - 12px)}
.pc-actions{flex-wrap:wrap}
@media (max-width:480px){
.pc{display:grid;grid-template-columns:130px minmax(0,1fr);column-gap:12px;row-gap:10px;align-items:start}
.pc-body{display:contents}
.pc-thumb{grid-column:1;grid-row:1;width:130px;height:86px}
.pc-paper{left:20px;width:90px}
.pc-meta{font-size:13px;gap:5px;padding:3px 6px}
.pc-star{font-size:14px}
.pc-title{grid-column:2;grid-row:1;font-size:15px}
.pc-actions{grid-column:1 / -1;grid-row:2;margin-top:0;width:100%;flex-wrap:nowrap}
}
/* --- Interaction protection: no copy, no double-tap / long-press menu, no zoom --- */
html, body {
  touch-action: manipulation;            /* disables double-tap-to-zoom; keeps tap + scroll */
  -webkit-touch-callout: none;           /* iOS: hide long-press callout menu */
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;                     /* prevent text selection / copy */
  -webkit-text-size-adjust: 100%;        /* iOS: stop automatic text inflation */
  -moz-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

* {
  -webkit-tap-highlight-color: transparent; /* remove tap highlight on mobile */
}

/* Keep form controls usable/selectable */
input, textarea, select {
  user-select: auto;
  -webkit-user-select: auto;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StudiTube CEE Solution</h1>
    <p class="lede">Self-paced online learning platform designed to help students with learning stuffs.</p>
  </header>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <div class="toolbar-right">
      <button class="theme" id="theme" type="button" aria-label="Toggle theme">
  <span class="theme-icon sun" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </span>
  <span class="theme-icon moon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79"/></svg>
  </span>
</button>
  <a class="omr-btn" id="omrBtn" href="pdf_stuffs/MECEE_BASED_PRACTICE_OMR_SHEET_A4.pdf" aria-label="View OMR Sheet" title="View OMR Sheet">
    OMR <span class="omr-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </span>
  </a>
    </div>
  </div>

  <main id="content">
    <p class="status">Loading PDFs…</p>
  </main>
</div>

<script>
  /* Interaction protection: blocks copy/paste, right-click/long-press menus,
     double-tap selection, and pinch / Ctrl-wheel zoom on all devices. */
  (function () {
    'use strict';

    // Block right-click / long-press context menu
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);

    // Block copy / cut / paste
    ['copy', 'cut', 'paste'].forEach(function (type) {
      document.addEventListener(type, function (e) { e.preventDefault(); }, true);
    });

    // Block double-click text selection
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, true);

    // Block multi-touch pinch zoom while keeping single-finger scroll
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // Legacy iOS gesture events
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

    // Desktop: block Ctrl/Cmd + mouse-wheel zoom
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false });
  })();

  const CONTENTS_URL = "contents.json";

  const content = document.getElementById("content");
  const countEl = document.getElementById("count");

  // contents.json stores paths like "/pdf_stuffs/file.pdf".
  // The files sit together, so treat them as relative to this page.
  function pdfHref(path) {
    return encodeURI(String(path).replace(/^\/+/, ""));
  }

  function showStatus(message, isError) {
    content.innerHTML = "";
    const p = document.createElement("p");
    p.className = "status" + (isError ? " error" : "");
    p.textContent = message;
    content.appendChild(p);
  }

  function pagesText(item) {
    const raw = item.pages || item.badge || "";
    return String(raw).split("•")[0].trim();
  }

  function buildRow(item) {
    const pages = pagesText(item);
    const hasPages = pages.length > 0;

    const li = document.createElement("li");
    li.className = "pc";

    li.innerHTML =
      '<div class="pc-thumb">' +
      '<div class="pc-paper"><b></b><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
      '<div class="pc-vignette"></div>' +
      '<div class="pc-meta"><span class="pc-pdfmark">PDF</span>' +
      (hasPages ? '<span class="pc-star" aria-hidden="true">★</span>' : '') +
      '</div>' +
      '</div>' +
      '<div class="pc-body">' +
      '<h4 class="pc-title"><span class="pc-fmt">PDF</span></h4>' +
      '<div class="pc-actions">' +
      (hasPages
        ? '<div class="pc-select"><span class="pc-res"></span><span class="pc-updown" aria-hidden="true"></span></div>'
        : '<div class="pc-select" style="display:none"><span class="pc-res"></span><span class="pc-updown" aria-hidden="true"></span></div>') +
      '<div class="pc-dl">' +
      '<a class="pc-main" target="_blank" rel="noopener"><span class="pc-icdoc"></span>View PDF</a>' +
      '<span class="pc-more" aria-hidden="true"><span class="pc-updown" aria-hidden="true"></span></span>' +
      '</div>' +
      '</div>' +
      '</div>';

    // {TITLE} inserted via textContent, never innerHTML
    li.querySelector(".pc-paper b").textContent = item.title;
    const h4 = li.querySelector(".pc-title");
    h4.appendChild(document.createTextNode(item.title));

    if (hasPages) {
      li.querySelector(".pc-meta").appendChild(document.createTextNode(pages));
      li.querySelector(".pc-res").textContent = pages;
    }

    const a = li.querySelector(".pc-main");
    a.href = pdfHref(item.pdf_path);
    a.setAttribute("aria-label", "View PDF: " + item.title);

    return li;
  }

  function render(data) {
    const modules = data.modules || {};
    const chapters = data.chapters || {};
    const pdfs = (data.pdf_stuffs || []).filter(
      (s) => s.stuff_type === "pdf" && s.pdf_path
    );

    if (!pdfs.length) {
      countEl.textContent = "0 PDFs";
      showStatus("No PDFs yet.", false);
      return;
    }

    // Group: module id -> chapter id -> items (keeps the order in contents.json)
    const byModule = new Map();
    pdfs.forEach((item) => {
      const chapterId = String(item.chapter_id || "");
      const moduleId = chapterId.split(".")[0];
      if (!byModule.has(moduleId)) byModule.set(moduleId, new Map());
      const chMap = byModule.get(moduleId);
      if (!chMap.has(chapterId)) chMap.set(chapterId, []);
      chMap.get(chapterId).push(item);
    });

    content.innerHTML = "";
    const frag = document.createDocumentFragment();

    byModule.forEach((chMap, moduleId) => {
      const section = document.createElement("section");
      section.className = "module";

      const h2 = document.createElement("h2");
      h2.textContent = modules[moduleId] || "PDFs";
      section.appendChild(h2);

      chMap.forEach((items, chapterId) => {
        const chapter = document.createElement("div");
        chapter.className = "chapter";

        const h3 = document.createElement("h3");
        h3.textContent = chapters[chapterId] || chapterId;
        chapter.appendChild(h3);

        const ol = document.createElement("ol");
        ol.className = "list";
        items.forEach((item) => ol.appendChild(buildRow(item)));
        chapter.appendChild(ol);

        section.appendChild(chapter);
      });

      frag.appendChild(section);
    });

    content.appendChild(frag);
    countEl.textContent = pdfs.length + (pdfs.length === 1 ? " PDF" : " PDFs");
  }

  fetch(CONTENTS_URL, { cache: "no-cache" })
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(render)
    .catch((err) => {
      console.error(err);
      countEl.textContent = "";
      showStatus(
        "Couldn't load contents.json. Open this page through a local server (for example, python -m http.server) instead of double-clicking the file.",
        true
      );
    });

  // Theme toggle (follows the device setting until you press the button)
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if (saved) root.setAttribute("data-theme", saved);

  document.getElementById("theme").addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    const isDark = current
      ? current === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    updateThemeIcons(next);
  });

  function updateThemeIcons(theme) {
    const sun = document.querySelector(".theme-icon.sun");
    const moon = document.querySelector(".theme-icon.moon");
    if (theme === "dark") {
      sun.style.display = "block";
      moon.style.display = "none";
    } else {
      sun.style.display = "none";
      moon.style.display = "block";
    }
  }

  // Initialize icons on load
  const initialTheme = root.getAttribute("data-theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  updateThemeIcons(initialTheme);

  // OMR button: open PDF in new tab (view only, no auto-download)
  document.getElementById("omrBtn").addEventListener("click", (e) => {
    e.preventDefault();
    const url = e.currentTarget.getAttribute("href");
    // Open PDF in a new tab for viewing (browser's built-in PDF viewer)
    window.open(url, "_blank");
  });
</script>
</body>
</html>
