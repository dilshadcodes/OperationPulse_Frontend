<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudiTube CEE Solution</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eceef1;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #5b6470;
  --line: #d3d8df;
  --accent: #d4351c;
  --hover: #f5f6f8;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #181b21; --ink: #eceef1; --muted: #98a1ae;
    --line: #2a2f38; --accent: #ff6a4d; --hover: #1f232a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #181b21; --ink: #eceef1; --muted: #98a1ae;
  --line: #2a2f38; --accent: #ff6a4d; --hover: #1f232a;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 10px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 40px);
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.lede { color: var(--muted); margin: 0; max-width: 62ch; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.theme {
  font-family: var(--font-body); font-size: 13px; font-weight: 600;
  padding: 7px 12px; min-height: 36px;
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); cursor: pointer;
}
.theme:hover { background: var(--hover); }

.status {
  margin: 0;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
}
.status.error { color: var(--accent); }

/* Module and chapter headings */
.module { display: flex; flex-direction: column; gap: 24px; }
.module > h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.chapter { display: flex; flex-direction: column; gap: 10px; }
.chapter > h3 {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

/* List rows with serial numbers */
.list {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: item;
  background: var(--surface);
  border: 1px solid var(--line);
}

.row {
  counter-increment: item;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px 12px 6px 16px;
  border-bottom: 1px solid var(--line);
  transition: background 0.15s;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }

.row::before {
  content: counter(item, decimal-leading-zero);
  flex: none;
  min-width: 2.2ch;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.info { flex: 1; min-width: 0; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
.title { margin: 0; font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.badge { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.pdf {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid transparent;
}
.pdf svg { width: 18px; height: 18px; }
.pdf:hover { border-color: var(--line); background: var(--surface); }
.pdf:focus-visible, .theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 480px) {
  .row { gap: 10px; padding-left: 12px; }
  .pdf .txt { display: none; }
  .pdf { padding: 0 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StudiTube CEE Solution</h1>
    <p class="lede">Self-paced online learning modules designed to help medical entrance preparing student master the concepts themselves.</p>
  </header>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <button class="theme" id="theme" type="button">Switch theme</button>
  </div>

  <main id="content">
    <p class="status">Loading PDFs…</p>
  </main>
</div>

<script>
  const CONTENTS_URL = "contents.json";

  const ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M14 3v4a1 1 0 0 0 1 1h4"/>' +
    '<path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>' +
    '<path d="M9 13h6"/><path d="M9 17h6"/></svg>';

  const content = document.getElementById("content");
  const countEl = document.getElementById("count");

  // contents.json stores paths like "/pdf_stuffs/file.pdf".
  // The files sit together, so treat them as relative to this page.
  function pdfHref(path) {
    return encodeURI(String(path).replace(/^\/+/, ""));
  }

  function showStatus(message, isError) {
    content.innerHTML = "";
    const p = document.createElement("p");
    p.className = "status" + (isError ? " error" : "");
    p.textContent = message;
    content.appendChild(p);
  }

  function buildRow(item) {
    const li = document.createElement("li");
    li.className = "row";

    const info = document.createElement("div");
    info.className = "info";

    const h4 = document.createElement("h4");
    h4.className = "title";
    h4.textContent = item.title;
    info.appendChild(h4);

    if (item.badge) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = item.badge;
      info.appendChild(badge);
    }

    const a = document.createElement("a");
    a.className = "pdf";
    a.href = pdfHref(item.pdf_path);
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("aria-label", "View PDF: " + item.title);
    a.innerHTML = ICON + '<span class="txt">View PDF</span>';

    li.append(info, a);
    return li;
  }

  function render(data) {
    const modules = data.modules || {};
    const chapters = data.chapters || {};
    const pdfs = (data.pdf_stuffs || []).filter(
      (s) => s.stuff_type === "pdf" && s.pdf_path
    );

    if (!pdfs.length) {
      countEl.textContent = "0 PDFs";
      showStatus("No PDFs yet.", false);
      return;
    }

    // Group: module id -> chapter id -> items (keeps the order in contents.json)
    const byModule = new Map();
    pdfs.forEach((item) => {
      const chapterId = String(item.chapter_id || "");
      const moduleId = chapterId.split(".")[0];
      if (!byModule.has(moduleId)) byModule.set(moduleId, new Map());
      const chMap = byModule.get(moduleId);
      if (!chMap.has(chapterId)) chMap.set(chapterId, []);
      chMap.get(chapterId).push(item);
    });

    content.innerHTML = "";
    const frag = document.createDocumentFragment();

    byModule.forEach((chMap, moduleId) => {
      const section = document.createElement("section");
      section.className = "module";

      const h2 = document.createElement("h2");
      h2.textContent = modules[moduleId] || "PDFs";
      section.appendChild(h2);

      chMap.forEach((items, chapterId) => {
        const chapter = document.createElement("div");
        chapter.className = "chapter";

        const h3 = document.createElement("h3");
        h3.textContent = chapters[chapterId] || chapterId;
        chapter.appendChild(h3);

        const ol = document.createElement("ol");
        ol.className = "list";
        items.forEach((item) => ol.appendChild(buildRow(item)));
        chapter.appendChild(ol);

        section.appendChild(chapter);
      });

      frag.appendChild(section);
    });

    content.appendChild(frag);
    countEl.textContent = pdfs.length + (pdfs.length === 1 ? " PDF" : " PDFs");
  }

  fetch(CONTENTS_URL, { cache: "no-cache" })
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(render)
    .catch((err) => {
      console.error(err);
      countEl.textContent = "";
      showStatus(
        "Couldn't load contents.json. Open this page through a local server (for example, python -m http.server) instead of double-clicking the file.",
        true
      );
    });

  // Theme toggle (follows the device setting until you press the button)
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if (saved) root.setAttribute("data-theme", saved);

  document.getElementById("theme").addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    const isDark = current
      ? current === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
</script>
</body>
</html>
