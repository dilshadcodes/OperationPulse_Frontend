  <meta name="theme-color" content="#080d1a">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=school,contacts,copyright,psychology,mark_email_unread">
  <style>
    :root {
      --bg: #080d1a;
      --text: #e8edf7;
      --accent: #4f8cff;
      --accent-2: #22d3ee;
      --accent-3: #ffd166;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: auto;
      min-height: 100%;
      overflow-x: clip;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: max(20px, env(safe-area-inset-top)) 20px 64px;
      overflow-x: clip;
      overscroll-behavior-y: auto;
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: auto;
      background:
        radial-gradient(900px 520px at 50% -12%, rgba(79, 140, 255, 0.24), transparent 60%),
        radial-gradient(700px 420px at 50% 110%, rgba(34, 211, 238, 0.14), transparent 60%),
        var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
      max-width: 56rem;
      margin-top: 40px;
    }

    /* stop wide children from pushing the centred column off screen */
    main > * {
      max-width: 100%;
      min-width: 0;
    }

    .portrait {
      width: min(100%, 360px, calc(50vh * 1.7962));
      aspect-ratio: 670 / 373;
      padding: 5px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      box-shadow: 0 22px 55px rgba(79, 140, 255, 0.28);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      border: 4px solid var(--bg);
      border-radius: 14px;
      object-fit: cover;
    }

    @media (max-width: 700px) {
      .portrait {
        width: 95%;
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 5.2vw, 2rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    /* ---------- name and role, top left ---------- */
    .corner-id {
      align-self: flex-start;
      width: max-content;
      max-width: calc(100vw - 40px);
      text-align: left;
      pointer-events: none;
    }

    .corner-id p {
      margin: 0;
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: break-word;
    }

    .corner-id .corner-id__name {
      display: inline-block;
      margin: 0;
      padding: 6px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f5a623;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1206;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      pointer-events: auto;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .corner-id .corner-id__name:hover,
    .corner-id .corner-id__name:focus-visible {
      border-color: rgba(34, 211, 238, 0.6);
      box-shadow: 0 8px 22px rgba(34, 211, 238, 0.28);
    }

    .corner-id .corner-id__name .corner-id__dot {
      margin-left: 2px;
      font-size: 28px;
      font-weight: 900;
      line-height: 0;
      color: #1a1206;
    }

    .corner-id .corner-id__role {
      font-size: 18px;
      color: rgba(232, 237, 247, 0.72);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .corner-id .corner-id__divider {
      display: block;
      width: 100%;
      height: 2px;
      margin: 8px 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
      opacity: 0.75;
    }

    .corner-id .corner-id__rule {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
    }

    .corner-id .corner-id__rule span {
      display: block;
      height: 7px;
      border-radius: 999px;
    }

    .corner-id .corner-id__rule span:nth-child(1) {
      width: 52px;
      background: #e56e1c;
    }

    .corner-id .corner-id__rule span:nth-child(2) {
      width: 124px;
      background: linear-gradient(90deg, #f5a623, #f7b733);
    }

    .corner-id .corner-id__rule span:nth-child(3) {
      width: 58px;
      background: #d89145;
    }

    /* ---------- intro copy and photo ---------- */
    .section-head {
      align-self: stretch;
      margin: 0;
      text-align: left;
    }

    .section-head p {
      margin: 0;
      font-weight: 700;
      line-height: 1.2;
    }

    .section-head .section-head__title {
      font-size: clamp(2rem, 6vw, 3.25rem);
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .section-head .section-head__divider {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 2px;
      margin: 8px 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
      opacity: 0.75;
    }

    .section-head .section-head__sub {
      margin-top: 12px;
      font-weight: 400;
      font-size: 18px;
      line-height: 1.6;
      color: rgba(232, 237, 247, 0.72);
    }

    .section-head .profile-frame {
      width: 200px;
      height: 200px;
      margin: 18px auto 0;
      padding: 5px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      box-shadow: 0 22px 55px rgba(79, 140, 255, 0.28);
    }

    .section-head .profile-frame img {
      display: block;
      width: 100%;
      height: 100%;
      border: 4px solid var(--bg);
      border-radius: 50%;
      object-fit: cover;
    }

    .section-head .section-head__rule {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .section-head .section-head__rule span {
      display: block;
      height: 7px;
      border-radius: 999px;
    }

    .section-head .section-head__rule span:nth-child(1) {
      width: 52px;
      background: #e56e1c;
    }

    .section-head .section-head__rule span:nth-child(2) {
      width: 124px;
      background: linear-gradient(90deg, #f5a623, #f7b733);
    }

    .section-head .section-head__rule span:nth-child(3) {
      width: 58px;
      background: #d89145;
    }

    /* ---------- construction notice ---------- */
    .construction {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .construction .construction__pill {
      display: inline-block;
      margin: 0;
      padding: 6px 14px;
      border-radius: 999px;
      background: #3d0a0a;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: clamp(1.4rem, 5.2vw, 2rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    /* ---------- copyright pill ---------- */
    .email-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      margin: 0;
      padding: 14px 30px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: #05070d;
      color: var(--text);
      font-size: clamp(1.05rem, 3.8vw, 1.3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
      text-decoration: none;
      overflow-wrap: break-word;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .email-pill .material-symbols-outlined {
      font-size: 1.1em;
      line-height: 1;
    }

    .email-pill:hover,
    .email-pill:focus-visible {
      color: var(--accent-2);
      border-color: rgba(34, 211, 238, 0.6);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-height: 740px) {
      body {
        justify-content: flex-start;
        padding-top: max(20px, env(safe-area-inset-top));
      }

      main {
        gap: 40px;
        margin-top: 40px;
      }

      .portrait {
        width: min(100%, 300px, calc((100vh - 380px) * 1.7962));
      }

      h1 {
        font-size: 1.25rem;
      }

      .email-pill {
        padding: 10px 22px;
        font-size: 1rem;
      }
    }

    /* ---------- the two halves, side by side on roomy screens ---------- */
    .split {
      display: flex;
      flex-direction: column;
      gap: 40px;
      width: 100%;
    }

    .split__rule {
      display: none;
    }

    /* each half keeps its own rhythm when stacked */
    .split__col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .split__col--left {
      gap: 40px;
    }

    .split__col--right {
      gap: 40px;
    }

    /* illustration keeps its centre line once the column narrows */
    @media (max-width: 999px) {
      .split__col--right .portrait {
        align-self: center;
      }
    }

    @media (min-width: 1000px) {
      main {
        max-width: 80rem;
        margin-top: 24px;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "top top"
          "left right"
          "bottom bottom";
        gap: 28px;
        padding: 36px 40px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.35);
      }

      .split__rule {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .split__rule span {
        display: block;
        height: 7px;
        border-radius: 999px;
      }

      .split__rule span:nth-child(1) {
        width: 52px;
        background: #e56e1c;
      }

      .split__rule span:nth-child(2) {
        flex: 1 1 auto;
        min-width: 60px;

      }

    (function () {

      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);

      var stop = function (event) {
        event.preventDefault();
      };

      ["copy", "cut", "paste", "dragstart", "selectstart", "contextmenu", "dblclick"].forEach(function (name) {
        document.addEventListener(name, stop, false);
      });

      document.addEventListener("keydown", function (event) {
        var key = event.key;

        if ((event.ctrlKey || event.metaKey) && (key === "+" || key === "-" || key === "=" || key === "0")) {
          event.preventDefault();
        }
      });

      window.addEventListener("wheel", function (event) {
        if (event.ctrlKey) {
          event.preventDefault();
        }
      }, { passive: false });

      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        document.addEventListener(name, stop, false);
      });

      var blockPinch = function (event) {
        if (event.touches && event.touches.length > 1) {
          event.preventDefault();
        }
      };

      document.addEventListener("touchstart", blockPinch, { passive: true });
      document.addEventListener("touchmove", blockPinch, { passive: true });
    })();
  </script>
