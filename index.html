    button.email-pill:hover,

    /* ---------- the two halves, side by side on roomy screens ---------- */
    .split {
      display: flex;

    /* illustration keeps its centre line once the column narrows */
    @media (max-width: 999px) {

    @media (min-width: 1000px) {
      main {

      }

      .split {

    @media (prefers-reduced-motion: reduce) {

  <script>
    (function () {
      "use strict";

      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);

      var stop = function (event) {
        event.preventDefault();
      };

      ["copy", "cut", "paste", "dragstart", "selectstart", "contextmenu", "dblclick"].forEach(function (name) {
        document.addEventListener(name, stop, false);
      });

      document.addEventListener("keydown", function (event) {
        var key = event.key;

        if ((event.ctrlKey || event.metaKey) && (key === "+" || key === "-" || key === "=" || key === "0")) {
          event.preventDefault();
        }
      });

      window.addEventListener("wheel", function (event) {
        if (event.ctrlKey) {
          event.preventDefault();
        }
      }, { passive: false });

      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        document.addEventListener(name, stop, false);
      });

      var blockPinch = function (event) {
        if (event.touches && event.touches.length > 1) {
          event.preventDefault();
        }
      };

      document.addEventListener("touchstart", blockPinch, { passive: true });
      document.addEventListener("touchmove", blockPinch, { passive: true });

      /* "Continue to Dashboard" — the only place this page ever navigates.
         Logged in -> /branches/, otherwise -> /auth/. The landing page itself
         never redirects on load, so a signed-in visitor still sees it. */
      var goDashboard = document.getElementById("goDashboard");

      if (goDashboard) {
        /* The pill is only dimmed while its navigation is in flight. Coming back
           via the Back button restores this page from bfcache with the DOM
           exactly as it was, so the disabled flag has to be cleared on restore
           or the pill would stay dead on the landing page. */
        var rearm = function () {
          goDashboard.disabled = false;
        };

        window.addEventListener("pageshow", rearm);
        window.addEventListener("popstate", rearm);
        document.addEventListener("visibilitychange", rearm);

        goDashboard.addEventListener("click", function () {
          if (goDashboard.disabled) {
            return;
          }

          goDashboard.disabled = true;

          /* If the navigation never happens (blocked, offline, same-page), do
             not leave the pill stuck off. */
          window.setTimeout(rearm, 4000);

          if (!window.DilshadAuth) {
            window.location.href = "/auth/";
            return;
          }

          DilshadAuth.ensureAuth().then(
            function () {
              window.location.href = "/branches/";
            },
            function () {
              try {
                DilshadAuth.clear();
              } catch (_) {}

              window.location.href = "/auth/";
            }
          );
        });
      }
    })();
  </script>
