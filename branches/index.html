---
layout: base
title: Branch Setup
active: branches
---
<style>
  .branch-toolbar {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    box-sizing: border-box;
    margin: -24px -24px 0;
    padding: 11px 16px 11px 20px;
    border-bottom: 0.4px solid #999;
  }
  .branch-title-row {
    display: flex;
    justify-content: flex-start;
  }
  .branch-actions-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
  }
  .branch-left {
    display: flex;
    justify-content: flex-start;
  }
  .branch-right {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .tool-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 32px;
    padding: 0 18px;
    border: 0.4px solid #999;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .tool-btn .material-symbols-outlined {
    font-size: 20px;
  }
  .page-title {
    background: #0a2a7a;
    border-color: #0a2a7a;
    cursor: default;
  }
  @media (hover: hover) and (pointer: fine) {
    .tool-btn:hover {
      background: #0a2a7a;
    }
  }
  .tool-btn:active {
    background: #0a2a7a;
  }
  @media (max-width: 480px) {
    .branch-actions-row {
      grid-template-columns: 1fr;
    }
    .branch-right {
      justify-content: flex-start;
    }
  }
</style>
<div class="branch-toolbar">
  <div class="branch-title-row">
    <div class="tool-btn page-title" aria-current="page"><span class="material-symbols-outlined">apartment</span> Branch Setup</div>
  </div>
  <div class="branch-actions-row">
  <div class="branch-left">
    <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">add</span> Create</div>
  </div>
  <div class="branch-right">
    <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">checklist</span> Select</div>
    <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">edit</span> Update</div>
  </div>
  </div>
</div>
