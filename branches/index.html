---
layout: base
title: Branch Setup
active: branches
---
<style>
  /* Page header (.page-header/.page-title) comes from _layouts/base.html. */
  .toolbar-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
  }
  .toolbar-left {
    display: flex;
    justify-content: flex-start;
  }
  .toolbar-right {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .tool-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 32px;
    padding: 0 18px;
    border: 0.4px solid #999;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .tool-btn .material-symbols-outlined {
    font-size: 20px;
  }
  @media (hover: hover) and (pointer: fine) {
    .tool-btn:hover {
      background: #0a2a7a;
    }
  }
  .tool-btn:active {
    background: #0a2a7a;
  }
  @media (max-width: 480px) {
    .toolbar-actions {
      grid-template-columns: 1fr;
    }
    .toolbar-right {
      justify-content: flex-start;
    }
  }
  /* ---------- Create Branch form (opens below the main header) ---------- */
  .branch-form {
    /* Same bleed + side padding as .page-header so it spans the full width. */
    box-sizing: border-box;
    margin: 0 -24px;
    padding: 14px 16px 14px 20px;
    border-bottom: 0.4px solid #999;
  }
  .form-head {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 0.4px solid #999;
  }
  .form-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 18px;
    border-radius: 999px;
    background: #0a2a7a;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    cursor: default;
  }
  .form-body {
    /* Auto-fit: packs as many fields as fit on one row, wrapping down to 1. */
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  .form-field {
    position: relative;
    display: block;
  }
  .form-field input {
    box-sizing: border-box;
    width: 100%;
    height: 56px;
    padding: 22px 14px 8px;
    /* Rectangular: no rounded corners. */
    border: 0.4px solid #999;
    border-radius: 0;
    background: #111;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    outline: none;
    /* Body disables selection site-wide; typing/selecting must work here. */
    -webkit-touch-callout: default;
    -webkit-user-select: text;
    user-select: text;
    touch-action: manipulation;
  }
  .form-field input:focus {
    border-color: #0a2a7a;
  }
  .form-field label {
    position: absolute;
    left: 14px;
    top: 18px;
    /* Keep the in-box title on one line when columns get narrow. */
    max-width: calc(100% - 28px);
    overflow: hidden;
    white-space: nowrap;
    color: #888;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    pointer-events: none;
    transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease;
  }
  /* Title stays inside the box: it shrinks into the top of the same input. */
  .form-field input:focus + label,
  .form-field input:not(:placeholder-shown) + label {
    top: 7px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .form-field[hidden] {
    display: none;
  }
  .form-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 0.4px solid #999;
  }
  .form-pages {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-pages[hidden] {
    display: none;
  }
  .page-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0.4px solid #999;
    border-radius: 50%;
    background: #111;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .page-pill[aria-current="page"] {
    background: #0a2a7a;
    border-color: #0a2a7a;
  }
  .foot-submit[hidden] {
    display: none;
  }
  .foot-submit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 32px;
    padding: 0 18px;
    margin-left: auto;
    /* Yellow pill: footer item 1, right-hand corner. */
    border: 0.4px solid #fbbf24;
    border-radius: 999px;
    background: #fbbf24;
    color: #111;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .foot-submit .material-symbols-outlined {
    font-size: 20px;
  }
  .tool-btn.is-open {
    background: #0a2a7a;
  }
</style>
<div class="page-header">
  <div class="title-row">
    <div class="page-title" aria-current="page"><span class="material-symbols-outlined">apartment</span> Branch Setup</div>
  </div>
  <div class="toolbar-actions">
    <div class="toolbar-left">
      <div class="tool-btn" id="btnCreate" role="button" tabindex="0" aria-expanded="false" aria-controls="branchForm"><span class="material-symbols-outlined">add_card</span> Create</div>
    </div>
    <div class="toolbar-right">
      <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">checklist</span> Select</div>
      <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">edit_square</span> Update</div>
    </div>
  </div>
</div>
<form class="branch-form" id="branchForm" hidden>
  <div class="form-head">
    <div class="form-pill"><span class="material-symbols-outlined">add_card</span> Create Branch</div>
  </div>
  <div class="form-body">
    <div class="form-field">
      <input id="fHostel" type="text" placeholder=" " autocomplete="organization" />
      <label for="fHostel">Hostel Name</label>
    </div>
    <div class="form-field">
      <input id="fBranch" type="text" placeholder=" " />
      <label for="fBranch">Branch Name</label>
    </div>
    <div class="form-field">
      <input id="fCapacity" type="number" inputmode="numeric" min="0" placeholder=" " />
      <label for="fCapacity">Enter Capacities</label>
    </div>
    <div class="form-field">
      <input id="fAddress" type="text" placeholder=" " autocomplete="street-address" />
      <label for="fAddress">Enter Address</label>
    </div>
    <div class="form-field">
      <input id="fContact" type="tel" inputmode="tel" placeholder=" " autocomplete="tel" />
      <label for="fContact">Enter Contact</label>
    </div>
  </div>
  <div class="form-foot">
    <div class="form-pages" id="formPages" role="navigation" aria-label="Form pages"></div>
    <div class="foot-submit" id="btnNext" role="button" tabindex="0"><span class="material-symbols-outlined">arrow_forward</span> Next</div>
    <div class="foot-submit" id="btnSubmit" role="button" tabindex="0" hidden><span class="material-symbols-outlined">check</span> Submit</div>
  </div>
</form>
<script>
(function(){
  var PAGE_SIZE = 5;
  var btn = document.getElementById('btnCreate');
  var form = document.getElementById('branchForm');
  if(!btn || !form) return;
  var pagesWrap = document.getElementById('formPages');
  var btnNext = document.getElementById('btnNext');
  var btnSubmit = document.getElementById('btnSubmit');
  var fields = Array.prototype.slice.call(form.querySelectorAll('.form-field'));
  var totalPages = Math.max(1, Math.ceil(fields.length / PAGE_SIZE));
  var current = 0;

  function renderPages(){
    if(!pagesWrap) return;
    pagesWrap.innerHTML = '';
    pagesWrap.hidden = totalPages <= 1;
    for(var p = 0; p < totalPages; p++){
      (function(page){
        var pill = document.createElement('div');
        pill.className = 'page-pill';
        pill.setAttribute('role', 'button');
        pill.setAttribute('tabindex', '0');
        pill.setAttribute('aria-label', 'Go to page ' + (page + 1));
        if(page === current) pill.setAttribute('aria-current', 'page');
        pill.textContent = String(page + 1);
        function go(e){
          if(e) e.preventDefault();
          showPage(page);
        }
        pill.addEventListener('click', go);
        pill.addEventListener('keydown', function(e){
          if(e.key === 'Enter' || e.key === ' '){ go(e); }
        });
        pagesWrap.appendChild(pill);
      })(p);
    }
  }

  function showPage(page){
    if(page < 0) page = 0;
    if(page > totalPages - 1) page = totalPages - 1;
    current = page;
    var start = page * PAGE_SIZE;
    var end = start + PAGE_SIZE;
    fields.forEach(function(field, idx){
      field.hidden = !(idx >= start && idx < end);
    });
    renderPages();
    var isLast = (page === totalPages - 1);
    if(btnNext) btnNext.hidden = isLast;
    if(btnSubmit) btnSubmit.hidden = !isLast;
    var first = fields[start] ? fields[start].querySelector('input') : null;
    if(first && !form.hidden) first.focus();
  }

  function nextPage(e){
    if(e) e.preventDefault();
    if(current >= totalPages - 1) return;
    showPage(current + 1);
  }

  function setOpen(open){
    form.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open){
      btn.classList.add('is-open');
      showPage(0);
    }else{
      btn.classList.remove('is-open');
    }
  }

  function toggle(e){
    if(e) e.preventDefault();
    setOpen(form.hidden);
  }

  btn.addEventListener('click', toggle);
  btn.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ toggle(e); }
  });
  if(btnNext){
    btnNext.addEventListener('click', nextPage);
    btnNext.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ nextPage(e); }
    });
  }
  if(btnSubmit){
    function submitForm(e){
      if(e) e.preventDefault();
      if(form.requestSubmit){ form.requestSubmit(); }
      else { form.submit(); }
    }
    btnSubmit.addEventListener('click', submitForm);
    btnSubmit.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ submitForm(e); }
    });
  }
  // Prevent implicit Enter-submit from skipping pages: advance instead, submit only on last page.
  form.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target && e.target.tagName === 'INPUT'){
      if(current < totalPages - 1){ e.preventDefault(); showPage(current + 1); }
    }
  });
  showPage(0);
})();
</script>
