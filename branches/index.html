---
layout: base
title: Branch Setup
active: branches
---
<style>
  /* Header styles live in base.html */
  .toolbar-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
  }
  .toolbar-left {
    display: flex;
    justify-content: flex-start;
  }
  .toolbar-right {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .tool-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 32px;
    padding: 0 18px;
    border: 0.4px solid #999;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .tool-btn .material-symbols-outlined {
    font-size: 20px;
  }
  @media (hover: hover) and (pointer: fine) {
    .tool-btn:hover {
      background: #0a2a7a;
    }
  }
  .tool-btn:active {
    background: #0a2a7a;
  }
  @media (max-width: 480px) {
    .toolbar-actions {
      grid-template-columns: 1fr;
    }
    .toolbar-right {
      justify-content: flex-start;
    }
  }
  /* Create form slides open right under the header */
  .branch-form {
    /* Stretch edge to edge like the header above */
    box-sizing: border-box;
    margin: 0 -24px;
    padding: 14px 16px 14px 20px;
    border-bottom: 0.4px solid #999;
  }
  .form-body {
    /* Fields flow into as many columns as fit */
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  .form-field {
    position: relative;
    display: block;
  }
  .form-field input {
    box-sizing: border-box;
    width: 100%;
    height: 56px;
    padding: 22px 14px 8px;
    /* Sharp corners on purpose */
    border: 0.4px solid #999;
    border-radius: 0;
    background: #111;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    outline: none;
    /* Page blocks selection, but typing here has to work */
    -webkit-touch-callout: default;
    -webkit-user-select: text;
    user-select: text;
    touch-action: manipulation;
  }
  .form-field input:focus {
    border-color: #0a2a7a;
  }
  .form-field label {
    position: absolute;
    left: 14px;
    top: 18px;
    /* Don't let the label spill out on narrow screens */
    max-width: calc(100% - 28px);
    overflow: hidden;
    white-space: nowrap;
    color: #888;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    pointer-events: none;
    transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease;
  }
  /* Label floats up and shrinks once you type */
  .form-field input:focus + label,
  .form-field input:not(:placeholder-shown) + label {
    top: 7px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .form-foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 0.4px solid #999;
  }
  .foot-submit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 32px;
    padding: 0 18px;
    /* Yellow submit pill pinned to the right */
    border: 0.4px solid #fbbf24;
    border-radius: 999px;
    background: #fbbf24;
    color: #111;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .foot-submit .material-symbols-outlined {
    font-size: 20px;
  }
  .tool-btn.is-open {
    background: #0a2a7a;
  }
</style>
<div class="page-header">
  <div class="title-row">
    <div class="page-title" aria-current="page"><span class="material-symbols-outlined">apartment</span> Branch Setup</div>
  </div>
  <div class="toolbar-actions">
    <div class="toolbar-left">
      <div class="tool-btn" id="btnCreate" role="button" tabindex="0" aria-expanded="false" aria-controls="branchForm"><span class="material-symbols-outlined" id="btnCreateIcon">add_card</span> Create</div>
    </div>
    <div class="toolbar-right">
      <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">checklist</span> Select</div>
      <div class="tool-btn" role="button" tabindex="0"><span class="material-symbols-outlined">edit_square</span> Update</div>
    </div>
  </div>
</div>
<form class="branch-form" id="branchForm" hidden>
  <div class="form-body">
    <div class="form-field">
      <input id="fHostel" type="text" placeholder=" " autocomplete="organization" />
      <label for="fHostel">Hostel Name</label>
    </div>
    <div class="form-field">
      <input id="fBranch" type="text" placeholder=" " />
      <label for="fBranch">Branch Name</label>
    </div>
    <div class="form-field">
      <input id="fCapacity" type="number" inputmode="numeric" min="0" placeholder=" " />
      <label for="fCapacity">Enter Capacities</label>
    </div>
    <div class="form-field">
      <input id="fAddress" type="text" placeholder=" " autocomplete="street-address" />
      <label for="fAddress">Enter Address</label>
    </div>
    <div class="form-field">
      <input id="fContact" type="tel" inputmode="tel" placeholder=" " autocomplete="tel" />
      <label for="fContact">Enter Contact</label>
    </div>
  </div>
  <div class="form-foot">
    <div class="foot-submit" role="button" tabindex="0"><span class="material-symbols-outlined">check</span> Submit</div>
  </div>
</form>
<script>
(function(){
  var btn = document.getElementById('btnCreate');
  var form = document.getElementById('branchForm');
  var icon = document.getElementById('btnCreateIcon');
  if(!btn || !form) return;

  function setOpen(open){
    form.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(icon) icon.textContent = open ? 'expand_less' : 'add_card';
    if(open){
      btn.classList.add('is-open');
      /* No auto-focus: keyboard opens only when the user taps a field. */
    }else{
      btn.classList.remove('is-open');
    }
  }

  function toggle(e){
    if(e) e.preventDefault();
    setOpen(form.hidden);
  }

  btn.addEventListener('click', toggle);
  btn.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ toggle(e); }
  });
})();
</script>
