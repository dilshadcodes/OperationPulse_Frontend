<h1>Home</h1>
<p id="hello">Welcome.</p>
<script src="/assets/js/auth.js"></script>
<script>
(function(){
if(!window.DilshadAuth)return;
DilshadAuth.ensureAuth().then(function(me){
try{localStorage.setItem('dilshad.user',JSON.stringify(me));}catch(_){}
var h=document.getElementById('hello');
if(h)h.textContent='Welcome, '+((me&&me.full_name)||(me&&me.email)||'back')+' — you are logged in.';
},function(){window.location.href='/';});
})();
</script>
